;=====================================================
; pjsip.conf  --  Lab VoIP (VOLUTAMENTE IN CHIARO / NON SICURO)
; Scopo didattico: dimostrare le vulnerabilita' di SIP/RTP non protetti.
;=====================================================

; ---- Trasporto: UDP in chiaro sulla porta standard 5060 ----
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- Template comuni (riusati dai due telefoni) ----
[endpoint-internal](!)
type=endpoint
context=interni
disallow=all
allow=ulaw            ; G.711 mu-law -> Wireshark lo ricostruisce nativamente
allow=alaw            ; G.711 a-law  -> fallback
direct_media=no       ; il media transita da Asterisk: cattura piu' semplice e prevedibile
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth-userpass](!)
type=auth
auth_type=userpass

[aor-single](!)
type=aor
max_contacts=1

; ---- Telefono A : estensione 6001 ----
[6001](endpoint-internal)
auth=6001
aors=6001
callerid=Telefono A <6001>

[6001](auth-userpass)
username=6001
password=Passw0rd6001

[6001](aor-single)

; ---- Telefono B : estensione 6002 ----
[6002](endpoint-internal)
auth=6002
aors=6002
callerid=Telefono B <6002>
media_encryption=sdes
media_encryption_optimistic=no

[6002](auth-userpass)
username=6002
password=Passw0rd6002

[6002](aor-single)

; ===== INSICURO (Scenario A - Caller ID Spoofing) =====
; Accetta chiamate ANONIME (non autenticate): e' la falla che dimostriamo.
