services:
  asterisk-insecure:
    build: ./asterisk
    container_name: voip-asterisk
    profiles: [insecure]
    volumes:
      - ./asterisk/pjsip.insecure.conf:/etc/asterisk/pjsip.conf:ro
    networks:
      voip_net:
        ipv4_address: 172.20.0.10

  asterisk-secure:
    build: ./asterisk
    container_name: voip-asterisk
    profiles: [secure]
    volumes:
      - ./asterisk/pjsip.secure.conf:/etc/asterisk/pjsip.conf:ro
    networks:
      voip_net:
        ipv4_address: 172.20.0.10

  phone-insecure:
    build: ./phone
    container_name: voip-phone
    profiles: [insecure]
    volumes:
      - ./phone/accounts.insecure:/root/.baresip/accounts:ro
    networks:
      voip_net:
        ipv4_address: 172.20.0.20
    stdin_open: true
    tty: true

  phone-secure:
    build: ./phone
    container_name: voip-phone
    profiles: [secure]
    volumes:
      - ./phone/accounts.secure:/root/.baresip/accounts:ro
    networks:
      voip_net:
        ipv4_address: 172.20.0.20
    stdin_open: true
    tty: true

  attacker:
    build: ./attacker
    container_name: voip-attacker
    networks:
      voip_net:
        ipv4_address: 172.20.0.66
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./captures:/captures

  spoofer:
    build: ./spoofer
    container_name: voip-spoofer
    networks:
      voip_net:
        ipv4_address: 172.20.0.99

networks:
  voip_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
